server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    server_tokens off;
    client_max_body_size 10M;

    root /var/www/dental-clinic;
    index index.html;

    # One canonical address: www redirects to the plain domain.
    if ($host = www.__DOMAIN__) {
        return 301 $scheme://__DOMAIN__$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Django: API and admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Nginx adds these security headers itself (above).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /static/ {
        alias /srv/dental-clinic/app/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/dental-clinic/app/backend/media/;
        expires 7d;
    }

    # React build files have unique names, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # React Router: unknown paths load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
